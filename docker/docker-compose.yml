
services:
  postgres:
    image: postgres:16-alpine
    container_name: modelbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: modelbench
      POSTGRES_USER: modelbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - modelbench_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelbench -d modelbench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modelbench_postgres_data:
